[package]
name = "mihomo-cli"
version = "0.3.0"
edition = "2021"
description = "Cross-platform setup & control CLI for Mihomo (Clash.Meta) proxy"
repository = "https://github.com/CNCSMonster/mihomo-cli"
license = "MIT"
readme = "README.md"
keywords = ["mihomo", "clash", "proxy", "cli", "tun"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
indicatif = "0.17"
flate2 = "1"
tar = "0.4"
zip = "2"
which = "7"
dirs = "6"
shellexpand = "3"
futures = "0.3"
tempfile = "3"
regex = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
