[package]
name = "mihomo-cli"
version = "0.5.0"
edition = "2021"
description = "Cross-platform setup & control CLI for Mihomo (Clash.Meta) proxy"
repository = "https://github.com/CNCSMonster/mihomo-cli"
license = "MIT"
readme = "README.md"
keywords = ["mihomo", "clash", "proxy", "cli", "tun"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dialoguer = "0.11"
indicatif = "0.17"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
which = "7"
dirs = "6"
shellexpand = "3"
futures = "0.3"
tempfile = "3"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
crossterm = "0.29.0"
libc = "0.2"
tokio-util = "=0.7.19"

[profile.release]
opt-level = "z"
lto = true
strip = true

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream", "system-proxy"] }
service-manager = "=0.11.0"
windows-service = "=0.8.1"
windows-sys = { version = "=0.60", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Console", "Win32_System_IO", "Win32_System_Com", "Win32_UI_Shell", "Win32_Foundation"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "system-proxy"] }
rustls-native-certs = "0.8"
