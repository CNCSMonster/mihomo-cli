name: Cross-platform E2E

# 触发：手动 dispatch（workflow_dispatch）或打 tag（v*）
# 矩阵：ubuntu-latest / macos-latest / windows-latest
# job 之间天然隔离（各自独立 runner），user/system 在干净环境分别验证。
# Windows 是二等公民（此前在真机上与 clash-verge-rev 冲突风险），
# 验证统一走 GitHub Actions runner。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            e2e-cargo-${{ matrix.os }}-

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-cli-${{ matrix.os }}
          # Windows produces mihomo-cli.exe; unix produces mihomo-cli
          path: |
            target/release/mihomo-cli
            target/release/mihomo-cli.exe

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            e2e-cargo-${{ matrix.os }}-
      - name: Unit + integration tests (platform-specific tests auto-skipped)
        shell: bash
        run: cargo test --release

  user-e2e:
    name: User mode E2E (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: mihomo-cli-${{ matrix.os }}
          path: bin/
      - name: Add binary to PATH
        shell: bash
        run: echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Smoke test
        shell: bash
        run: |
          # Windows: binary is mihomo-cli.exe (case-insensitive FS makes a
          # no-suffix copy impossible). Export CLI as the per-platform path.
          if [ -f bin/mihomo-cli.exe ]; then
            echo "CLI=$PWD/bin/mihomo-cli.exe" >> "$GITHUB_ENV"
            "$PWD/bin/mihomo-cli.exe" --version
            "$PWD/bin/mihomo-cli.exe" version
          else
            chmod +x bin/mihomo-cli
            echo "CLI=$PWD/bin/mihomo-cli" >> "$GITHUB_ENV"
            bin/mihomo-cli --version
            bin/mihomo-cli version
          fi

      # install --skip-config：非交互安装，跳过订阅配置步骤
      # （CI 无真实订阅；config 留空，service 生命周期验证不受影响）
      - name: User mode install
        shell: bash
        run: |
          $CLI install --user --skip-config
          echo "=== status after install ==="
          $CLI status

      - name: User mode lifecycle (start/status/stop)
        shell: bash
        run: |
          $CLI start
          $CLI status
          $CLI stop

      - name: User mode uninstall
        shell: bash
        run: |
          $CLI uninstall --user --yes

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== status ==="
          $CLI status 2>&1 || true
          echo "=== platform checks ==="
          case "${{ matrix.os }}" in
            ubuntu-latest)
              echo "--- systemd user session ---"
                  systemctl --user is-system-running 2>&1 || true
                  loginctl show-user "$USER" -p Linger 2>&1 || true
              ;;
            macos-latest)
              echo "--- launchctl gui domain ---"
                  launchctl print "gui/$(id -u)" 2>&1 | head -3 || true
              ;;
            windows-latest)
              echo "--- mihomo processes ---"
                  tasklist | grep -i mihomo || true
              ;;
          esac

  system-e2e:
    name: System mode E2E (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: mihomo-cli-${{ matrix.os }}
          path: bin/
      - name: Add binary to PATH
        shell: bash
        run: echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Smoke test
        shell: bash
        run: |
          # Windows: binary is mihomo-cli.exe; export CLI as per-platform path.
          if [ -f bin/mihomo-cli.exe ]; then
            echo "CLI=$PWD/bin/mihomo-cli.exe" >> "$GITHUB_ENV"
            "$PWD/bin/mihomo-cli.exe" --version
          else
            chmod +x bin/mihomo-cli
            echo "CLI=$PWD/bin/mihomo-cli" >> "$GITHUB_ENV"
            bin/mihomo-cli --version
          fi

      - name: System mode install
        shell: bash
        run: |
          $CLI install --system --skip-config
          echo "=== status after install ==="
          $CLI status
          # N1c: strong assertion — service must be installed (system service)
          $CLI status | grep -i "system service"

      - name: System mode lifecycle (start/status/stop/start)
        shell: bash
        run: |
          $CLI start
          $CLI status
          $CLI stop
          $CLI start
          $CLI status

      - name: System mode uninstall
        shell: bash
        run: |
          $CLI uninstall --system --yes
          # N1c: after uninstall, no service may remain
          if $CLI status | grep -i "system service"; then
            echo "ERROR: service still present after uninstall"
            exit 1
          fi

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== status ==="
          $CLI status 2>&1 || true
          echo "=== platform checks ==="
          case "${{ matrix.os }}" in
            ubuntu-latest)
              echo "--- systemd unit ---"
                  systemctl status mihomo 2>&1 | head -5 || true
              ;;
            macos-latest)
              echo "--- launchd daemon ---"
                  launchctl print system/io.mihomo 2>&1 | head -3 || true
              ;;
            windows-latest)
              echo "--- service ---"
                  sc.exe query mihomo 2>&1 || true
                  echo "--- service binPath (qc) ---"
                  sc.exe qc mihomo 2>&1 || true
                  echo "--- CONTROL: manual sc create with proper binPath ---"
                  sc.exe delete mihomo-test 2>/dev/null || true
                  sc.exe create mihomo-test binPath= "\"C:\ProgramData\mihomo\bin\mihomo-cli.exe\" daemon" start= demand DisplayName= "Mihomo Test" 2>&1 || true
                  sc.exe start mihomo-test 2>&1 || true
                  sc.exe query mihomo-test 2>&1 | head -8 || true
                  sc.exe delete mihomo-test 2>/dev/null || true
                  echo "--- manual daemon smoke (3s) ---"
                  "C:\ProgramData\mihomo\bin\mihomo-cli.exe" daemon &
                  DAEMON_PID=$!
                  sleep 3
                  if kill -0 $DAEMON_PID 2>/dev/null; then
                    echo "daemon alive after 3s (pid $DAEMON_PID)"
                    kill $DAEMON_PID 2>/dev/null || true
                  else
                    echo "daemon exited within 3s"
                  fi
                  echo "--- event log (Service Control Manager) ---"
                  powershell -NoProfile -Command "Get-WinEvent -LogName System -MaxEvents 20 | Where-Object {\$_.ProviderName -match 'Service Control Manager'} | Select-Object -First 3 TimeCreated, Id, Message | Format-List" 2>&1 || true
              ;;
          esac
