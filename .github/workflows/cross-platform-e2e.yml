name: Cross-platform E2E

# 触发：手动 dispatch（workflow_dispatch）或打 tag（v*）
# 矩阵：ubuntu-latest / macos-latest / windows-latest
# job 之间天然隔离（各自独立 runner），user/system 在干净环境分别验证。
# Windows 是二等公民（此前在真机上与 clash-verge-rev 冲突风险），
# 验证统一走 GitHub Actions runner。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            e2e-cargo-${{ matrix.os }}-

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-cli-${{ matrix.os }}
          # Windows produces mihomo-cli.exe; unix produces mihomo-cli
          path: |
            target/release/mihomo-cli
            target/release/mihomo-cli.exe

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            e2e-cargo-${{ matrix.os }}-
      - name: Unit + integration tests (platform-specific tests auto-skipped)
        shell: bash
        run: cargo test --release

  user-e2e:
    name: User mode E2E (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: mihomo-cli-${{ matrix.os }}
          path: bin/
      - name: Add binary to PATH
        shell: bash
        run: echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Smoke test
        shell: bash
        run: |
          # Windows: binary is mihomo-cli.exe (case-insensitive FS makes a
          # no-suffix copy impossible). Export CLI as the per-platform path.
          if [ -f bin/mihomo-cli.exe ]; then
            echo "CLI=$PWD/bin/mihomo-cli.exe" >> "$GITHUB_ENV"
            "$PWD/bin/mihomo-cli.exe" --version
            "$PWD/bin/mihomo-cli.exe" version
          else
            chmod +x bin/mihomo-cli
            echo "CLI=$PWD/bin/mihomo-cli" >> "$GITHUB_ENV"
            bin/mihomo-cli --version
            bin/mihomo-cli version
          fi

      # install --skip-config + 预置最小 config（端口 18789 避开 runner 占用）：
      # install 检测到 config 存在即跳过订阅交互，core 用 18789 启动。
      - name: User mode install
        shell: bash
        run: |
          # Preseed a minimal config at the platform config path.
          # Windows user mode uses a named-pipe controller; unix uses HTTP.
          # NOTE: use %s printf to avoid \\ escaping eating backslashes.
          case "${{ matrix.os }}" in
            windows-latest) CFG_DIR="$APPDATA/mihomo"
              mkdir -p "$CFG_DIR"
              printf 'mixed-port: 18789\nlog-level: info\nexternal-controller-pipe: %s\n' '\\.\pipe\mihomo-core' > "$CFG_DIR/config.yaml" ;;
            *) CFG_DIR="$HOME/.config/mihomo"
              mkdir -p "$CFG_DIR"
              printf 'mixed-port: 18789\nlog-level: info\nexternal-controller: 127.0.0.1:18790\n' > "$CFG_DIR/config.yaml" ;;
          esac
          $CLI install --user --skip-config --yes
          echo "=== status after install ==="
          $CLI status

      - name: User mode lifecycle (stop/start/status)
        shell: bash
        run: |
          # install already started the core (API ready); verify stop → start cycle.
          $CLI stop
          $CLI status
          $CLI start
          $CLI status

      - name: User mode uninstall
        shell: bash
        run: |
          $CLI uninstall --user --yes

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== status ==="
          $CLI status 2>&1 || true
          echo "=== platform checks ==="
          case "${{ matrix.os }}" in
            ubuntu-latest)
              echo "--- systemd user session ---"
              systemctl --user is-system-running 2>&1 || true
              loginctl show-user "$USER" -p Linger 2>&1 || true
              echo "--- systemd user unit status ---"
              systemctl --user status mihomo --no-pager 2>&1 || true
              echo "--- systemd user unit journal ---"
              journalctl --user -u mihomo --no-pager -n 50 2>&1 || true
              echo "--- mihomo log ---"
              cat "$HOME/.local/state/mihomo/mihomo.log" 2>&1 || true
              ;;
            macos-latest)
              echo "--- launchctl gui domain ---"
                  launchctl print "gui/$(id -u)" 2>&1 | head -3 || true
              ;;
            windows-latest)
              echo "--- mihomo processes ---"
                  tasklist | grep -i mihomo || true
              echo "--- mihomo log (user mode) ---"
              cat "$LOCALAPPDATA/mihomo/mihomo.log" 2>&1 || true
              echo "--- mihomo log (system mode) ---"
              cat "$ProgramData/mihomo/mihomo.log" 2>&1 || true
              ;;
          esac

  system-e2e:
    name: System mode E2E (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            e2e-cargo-${{ matrix.os }}-
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: mihomo-cli-${{ matrix.os }}
          path: bin/
      - name: Add binary to PATH
        shell: bash
        run: echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Smoke test
        shell: bash
        run: |
          # Windows: binary is mihomo-cli.exe; export CLI as per-platform path.
          if [ -f bin/mihomo-cli.exe ]; then
            echo "CLI=$PWD/bin/mihomo-cli.exe" >> "$GITHUB_ENV"
            "$PWD/bin/mihomo-cli.exe" --version
          else
            chmod +x bin/mihomo-cli
            echo "CLI=$PWD/bin/mihomo-cli" >> "$GITHUB_ENV"
            bin/mihomo-cli --version
          fi

      - name: System mode install
        shell: bash
        run: |
          # Preseed a minimal config (Windows: named-pipe controller; unix: HTTP).
          case "${{ matrix.os }}" in
            windows-latest) CFG_DIR="$APPDATA/mihomo"
              mkdir -p "$CFG_DIR"
              printf 'mixed-port: 18789\nlog-level: info\nexternal-controller-pipe: %s\n' '\\.\pipe\mihomo-core' > "$CFG_DIR/config.yaml" ;;
            *) CFG_DIR="$HOME/.config/mihomo"
              mkdir -p "$CFG_DIR"
              printf 'mixed-port: 18789\nlog-level: info\nexternal-controller: 127.0.0.1:18790\n' > "$CFG_DIR/config.yaml" ;;
          esac
          $CLI install --system --skip-config --yes
          echo "=== status after install ==="
          $CLI status
          # N1c: strong assertion — service must be installed (system service)
          $CLI status | grep -i "system service"

      - name: Unit test isolation with active system service (#012 regression)
        shell: bash
        run: |
          # Verify that running unit tests with active system service directories/files
          # does not leak into live service or fail with EACCES (Issue #012)
          cargo test --bin mihomo-cli daemon

      - name: System mode lifecycle (stop/start/status)
        shell: bash
        run: |
          # install already started the core; verify stop → start cycle.
          $CLI stop
          $CLI status
          $CLI start
          $CLI status

      - name: Core API forwarding and Selection Mirror replay (#017 regression)
        shell: bash
        run: |
          # Prepare offline direct proxy and group fixture
          cat << 'EOF' > fixture-sub.yaml
          mixed-port: 18789
          log-level: info
          proxies:
            - name: "NodeA"
              type: direct
            - name: "NodeB"
              type: direct
          proxy-groups:
            - name: "ProxyGroup"
              type: select
              proxies:
                - "NodeA"
                - "NodeB"
                - "DIRECT"
          rules:
            - "MATCH,DIRECT"
          EOF

          # Import and activate test subscription in system mode
          $CLI config --import fixture-sub.yaml --activate --yes --system
          $CLI restart --system --yes

          # 1. Verify Core API forwarding: query proxy groups via list
          echo "=== list proxies via Core API forwarding ==="
          LIST_OUT=$($CLI list)
          echo "$LIST_OUT"
          echo "$LIST_OUT" | grep -i "ProxyGroup"

          # 2. Verify non-interactive proxy selection & intent persistence
          echo "=== select NodeB ==="
          $CLI select --group ProxyGroup --node NodeB
          $CLI list | grep -E "ProxyGroup.*NodeB"

          # 3. Check Selection Mirror persistence on disk
          case "${{ matrix.os }}" in
            windows-latest)
              MIRROR_FILE="$PROGRAMDATA/mihomo/runtime/selection-mirror.yaml"
              if [ -f "$MIRROR_FILE" ]; then
                echo "✓ Windows Selection Mirror file exists: $MIRROR_FILE"
                cat "$MIRROR_FILE"
              else
                echo "Selection mirror info:"
                ls -la "$PROGRAMDATA/mihomo/runtime" 2>/dev/null || true
              fi
              ;;
            *)
              if [ -f "/var/lib/mihomo-cli/runtime/selection-mirror.yaml" ]; then
                echo "✓ Unix Selection Mirror file exists"
                cat "/var/lib/mihomo-cli/runtime/selection-mirror.yaml" 2>/dev/null || true
              fi
              ;;
          esac

          # 4. Verify selection replay across restart
          echo "=== restart and verify selection replay ==="
          $CLI restart --system --yes
          REPLAY_OUT=$($CLI list)
          echo "$REPLAY_OUT"
          echo "$REPLAY_OUT" | grep -E "ProxyGroup.*NodeB"

          # 5. Verify doctor checks pass in system mode
          echo "=== doctor in system mode ==="
          $CLI doctor --system || true

      - name: System mode uninstall
        shell: bash
        run: |
          $CLI uninstall --system --yes
          # N1c: after uninstall, status must report no service installed.
          # NOTE: "Mode: system service" is a label shown even when uninstalled;
          # "No service is installed." is the presence line we assert on.
          OUT=$($CLI status)
          echo "$OUT" | grep -iE "^[ ]*no service is installed"
          if echo "$OUT" | grep -viE "no service" | grep -iE "service is installed|installed service detection"; then
            echo "ERROR: service still present after uninstall"
            exit 1
          fi

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== status ==="
          $CLI status 2>&1 || true
          echo "=== platform checks ==="
          case "${{ matrix.os }}" in
            ubuntu-latest)
              echo "--- systemd unit ---"
                  systemctl status mihomo 2>&1 | head -5 || true
              ;;
            macos-latest)
              echo "--- launchd daemon ---"
                  launchctl print system/io.mihomo 2>&1 | head -3 || true
              ;;
            windows-latest)
              echo "--- service ---"
                  sc.exe query mihomo 2>&1 || true
                  echo "--- service binPath (qc) ---"
                  sc.exe qc mihomo 2>&1 || true
                  echo "--- CONTROL: manual sc create with proper binPath ---"
                  sc.exe delete mihomo-test 2>/dev/null || true
                  sc.exe create mihomo-test binPath= "\"C:\ProgramData\mihomo\bin\mihomo-cli.exe\" daemon" start= demand DisplayName= "Mihomo Test" 2>&1 || true
                  sc.exe start mihomo-test 2>&1 || true
                  sc.exe query mihomo-test 2>&1 | head -8 || true
                  sc.exe delete mihomo-test 2>/dev/null || true
                  echo "--- manual daemon smoke (3s) ---"
                  "C:\ProgramData\mihomo\bin\mihomo-cli.exe" daemon &
                  DAEMON_PID=$!
                  sleep 3
                  if kill -0 $DAEMON_PID 2>/dev/null; then
                    echo "daemon alive after 3s (pid $DAEMON_PID)"
                    kill $DAEMON_PID 2>/dev/null || true
                  else
                    echo "daemon exited within 3s"
                  fi
                  echo "--- event log (Service Control Manager) ---"
                  powershell -NoProfile -Command "Get-WinEvent -LogName System -MaxEvents 20 | Where-Object {\$_.ProviderName -match 'Service Control Manager'} | Select-Object -First 3 TimeCreated, Id, Message | Format-List" 2>&1 || true
              ;;
          esac
