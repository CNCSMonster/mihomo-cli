name: Release

# Release 在 Cross-platform E2E 工作流成功完成后触发
# 确保发布前所有平台的端到端测试通过
on:
  workflow_run:
    workflows: ["Cross-platform E2E"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.5.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # workflow_run 触发时：检查 E2E 成功且 head_branch 是 tag
    # workflow_dispatch 触发时：始终运行
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest

    steps:
      - name: Determine ref to checkout
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig (Linux only)
        if: runner.os == 'Linux'
        run: |
          ZIG_URL="https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz"
          echo "Downloading: $ZIG_URL"
          curl -fsSL "$ZIG_URL" -o zig.tar.xz
          tar xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          "$PWD/zig-linux-x86_64-0.13.0/zig" version

      - name: Install cargo-zigbuild (Linux only)
        if: runner.os == 'Linux'
        run: cargo install cargo-zigbuild

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build (macOS native)
        if: runner.os == 'macOS'
        run: cargo build --target ${{ matrix.target }} --release

      - name: Build (Linux cross-compile)
        if: runner.os == 'Linux'
        run: cargo zigbuild --target ${{ matrix.target }} --release

      - name: Package (Unix)
        if: runner.os != 'windows-latest' && matrix.target != 'x86_64-pc-windows-gnu'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../mihomo-cli-${{ matrix.target }}.tar.gz mihomo-cli
          cd ../../..

      - name: Package (Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../mihomo-cli-${{ matrix.target }}.zip mihomo-cli.exe
          cd ../../..

      - name: Generate checksum
        run: |
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            sha256sum mihomo-cli-${{ matrix.target }}.zip > mihomo-cli-${{ matrix.target }}.zip.sha256
          else
            sha256sum mihomo-cli-${{ matrix.target }}.tar.gz > mihomo-cli-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-cli-${{ matrix.target }}
          path: |
            mihomo-cli-${{ matrix.target }}.tar.gz
            mihomo-cli-${{ matrix.target }}.tar.gz.sha256
            mihomo-cli-${{ matrix.target }}.zip
            mihomo-cli-${{ matrix.target }}.zip.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # workflow_run 触发时：检查 E2E 成功且 head_branch 是 tag
    # workflow_dispatch 触发时：使用输入的 tag
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # workflow_run: head_branch is like "refs/tags/v0.5.2"
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            ## Assets

            | Platform | File |
            |----------|------|
            | Linux x64 (glibc) | `mihomo-cli-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux x64 (musl) | `mihomo-cli-x86_64-unknown-linux-musl.tar.gz` |
            | Linux arm64 (musl) | `mihomo-cli-aarch64-unknown-linux-musl.tar.gz` |
            | macOS x64 | `mihomo-cli-x86_64-apple-darwin.tar.gz` |
            | macOS arm64 | `mihomo-cli-aarch64-apple-darwin.tar.gz` |
            | Windows x64 | `mihomo-cli-x86_64-pc-windows-gnu.zip` |

            ## Install

            Download the binary for your platform from **Assets** below.

            ### Linux / macOS

            ```bash
            # 解压
            tar xzf mihomo-cli-*.tar.gz

            # 移动到 PATH
            sudo mv mihomo-cli /usr/local/bin/
            # 或者用户级安装
            mkdir -p ~/.local/bin
            mv mihomo-cli ~/.local/bin/

            # 验证安装
            mihomo-cli --version
            ```

            ### Windows

            ```powershell
            # 解压
            Expand-Archive -Path mihomo-cli-*.zip -DestinationPath .

            # 移动到 PATH（需要管理员权限）
            Move-Item mihomo-cli.exe "C:\Program Files\mihomo-cli\"
            # 或者用户级安装
            Move-Item mihomo-cli.exe "$env:APPDATA\mihomo-cli\"

            # 验证安装
            mihomo-cli --version
            ```

            ### 首次使用

            ```bash
            # 交互式安装（选择普通代理模式或 TUN 模式）
            mihomo-cli install

            # 或者直接开启 TUN（自动引导安装 system service）
            mihomo-cli tun on
            ```

            > **注意**：TUN 模式需要管理员权限，CLI 会自动请求 sudo（Linux/macOS）或 UAC（Windows）。

            ## Checksums

            See `checksums.txt` in Assets for SHA256 verification.
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
